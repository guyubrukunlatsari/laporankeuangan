<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dashboard Keuangan RT 04 RW 01 LATSARI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; background-color: #0f0f0f; color: #f1f1f1; margin:0; padding:10px;}
  h1 { text-align:center; color:#00ff88; margin-bottom:10px; font-size:1.2rem;}
  #menu { display:flex; justify-content:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  #menu button { padding:5px 10px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; transition:0.2s; background:#00cc66; color:#000;}
  #menu button.active, #menu button:hover { background:#00ff88; }

  .filter-container { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:10px; }
  .filter-container input, .filter-container button { padding:5px 8px; border-radius:5px; border:1px solid #444; background:#1a1a1a; color:#fff; font-size:0.85rem; }
  .filter-container button { background:#00cc66; font-weight:bold; color:#000; cursor:pointer; }
  .filter-container button:hover { background:#00ff88; }

  .table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; min-width:300px; }
  th, td { padding:5px; text-align:center; font-size:0.8rem; border-bottom:1px solid #333; }
  th { background-color:#00cc66; color:#000; }
  td.nominal, td.jumlah { color:#00ff99; font-weight:bold; }
  td.foto img { max-width:60px; max-height:50px; border-radius:3px; display:block; margin:auto; }
  tr:nth-child(even){background:#1e1e1e;}
  tr:hover{background:#2a2a2a;}

  .highlight{background:#00ff44;color:#000;font-weight:bold;border-radius:3px;padding:0 2px;}

  .pagination{display:flex; justify-content:center; flex-wrap:wrap; gap:5px; margin-top:5px;}
  .pagination button{padding:4px 6px; border-radius:5px; font-size:0.8rem;}
  .pagination button.active{background:#00ff88;color:#000; transform:scale(1.1);}
  .pagination button:disabled{background:#333;color:#777; cursor:not-allowed;}

  #update-time {text-align:center; color:#aaa; font-size:0.75rem; margin-bottom:5px;}
  #total-container { text-align:center; margin-top:5px; font-weight:bold; color:#00ff88; }
/* Warna isi kolom uang sama seperti total */
td.rupiah {
  color: #00ff88; /* sama persis dengan warna total */
  font-weight: bold;
}
  footer { text-align:center; font-size:10px; color:#777; margin-top:10px; }

  .hidden{display:none;}
  @media(max-width:600px){
    .filter-container input, .filter-container button { width:100%; max-width:220px;}
    td.foto img { max-width:50px; max-height:40px;}
  }
</style>
</head>
<body>
<h1>Dashboard Keuangan RT 04 RW 01 LATSARI</h1>
<div id="menu">
  <button class="active" data-sheet="harian">Jimpitan Harian</button>
  <button data-sheet="bulanan">Warga Bulanan</button>
  <button data-sheet="pengeluaran">Pengeluaran</button>
  <button data-sheet="rekap">Rekap Keuangan</button>
</div>

<div id="update-time">Diperbarui otomatis: ⏳</div>

<div class="filter-container">
  <label>Dari: <input type="date" id="startDate"></label>
  <label>Sampai: <input type="date" id="endDate"></label>
  <input type="text" id="searchBox" placeholder="🔎 Cari semua kolom..." />
  <button onclick="resetFilter()">🔄 Reset</button>
  <button onclick="exportPDF()">📄 Export PDF</button>
</div>

<div class="table-wrapper">
  <table id="main-table">
    <thead id="table-head"></thead>
    <tbody id="table-body"><tr><td colspan="8">⏳ Memuat data...</td></tr></tbody>
  </table>
</div>

<div id="total-container"></div>
<div class="pagination" id="pagination"></div>
<footer>Data otomatis diperbarui dari Google Sheet</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script>
const sheetsConfig = {
  harian:{ sheetId:"1g1fp70L86yFkZt6OcOQjdKK9kgtHmPb2TqLou7a-4Pw", sheetName:"Laporan Jimpitan Harian", columns:["No","Tanggal","Hari Jaga","Hadir","Izin","Alpha","Hasil (Rp)","Keterangan"], query:"SELECT A,B,C,E,F,G,H,I", rowsPerPage:10 },
  bulanan:{ sheetId:"1g1fp70L86yFkZt6OcOQjdKK9kgtHmPb2TqLou7a-4Pw", sheetName:"Laporan Warga Bulanan", columns:["NO","TANGGAL","NAMA WARGA","PERIODE BAYAR","NOMINAL (Rp)","KETERANGAN","FOTO"], query:"SELECT A,B,C,D,E,F,G", rowsPerPage:10 },
  pengeluaran:{ sheetId:"1g1fp70L86yFkZt6OcOQjdKK9kgtHmPb2TqLou7a-4Pw", sheetName:"Laporan Pengeluaran", columns:["NO","TANGGAL","KEPERLUAN","NOMINAL (Rp)","KETERANGAN","FOTO"], query:"SELECT A,B,C,D,E,F", rowsPerPage:10 },
  rekap:{ sheetId:"1g1fp70L86yFkZt6OcOQjdKK9kgtHmPb2TqLou7a-4Pw", sheetName:"Rekap Keuangan RT", columns:["DESKRIPSI","JUMLAH"], query:"SELECT A,B", rowsPerPage:1000 }
};

let currentSheet="harian", allData=[], filteredData=[], currentPage=1, currentKeyword="";

function parseDate(val) {
  if (!val) return { text: "", raw: new Date("1970-01-01") };

  // Format bawaan Google Sheets (Date(2025,9,30))
  if (typeof val === "string" && val.includes("Date(")) {
    const m = val.match(/Date\((\d+),(\d+),(\d+)/);
    if (m) {
      const d = new Date(m[1], m[2], m[3]);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return { text: `${day}-${month}-${year}`, raw: d };
    }
  }

  const d = new Date(val);
  if (!isNaN(d)) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return { text: `${day}-${month}-${year}`, raw: d };
  }

  return { text: val, raw: new Date("1970-01-01") };
}

function showLoading(){
  document.getElementById("table-body").innerHTML=`<tr><td colspan="8">⏳ Memuat data...</td></tr>`;
}

function fetchData(){
  showLoading();
  const config = sheetsConfig[currentSheet];
  const url=`https://docs.google.com/spreadsheets/d/${config.sheetId}/gviz/tq?sheet=${config.sheetName}&tq=${encodeURIComponent(config.query)}`;

  fetch(url).then(res=>res.text()).then(rep=>{
    try{
      const json=JSON.parse(rep.match(/google\.visualization\.Query\.setResponse\((.*)\)/)[1]);
      const rows=json.table.rows.map(r=>r.c.map(c=>c?c.v:""));
      allData=rows.map((r,i)=>{
        const t=parseDate(r[1]);
        let obj={};
        config.columns.forEach((col,j)=>{
          obj[col]=r[j]||"";
        });
        if(obj["Tanggal"]||obj["TANGGAL"]) obj["TanggalObj"]=t.raw;
        if(obj["Tanggal"]) obj["Tanggal"]=t.text;
        if(obj["TANGGAL"]) obj["TANGGAL"]=t.text;
        if(obj["JUMLAH"]) obj["JUMLAH"]=formatRupiah(obj["JUMLAH"]);
        if(obj["Hasil (Rp)"]) obj["Hasil (Rp)"]=formatRupiah(obj["Hasil (Rp)"]);
        return obj;
      });

      if(allData[0] && allData[0]["TanggalObj"]) allData.sort((a,b)=>b["TanggalObj"]-a["TanggalObj"]);
      if(allData[0] && (allData[0]["No"]||allData[0]["NO"])) allData.forEach((row,index)=>row["No"]=allData.length - index);

      filteredData=allData;
      renderTable();
      const now=new Date();
      document.getElementById("update-time").textContent="Diperbarui otomatis: "+ now.toLocaleString("id-ID",{weekday:"short", day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
    }catch(err){
      document.getElementById("table-body").innerHTML=`<tr><td colspan="${config.columns.length}">❌ Gagal memuat data: ${err.message}</td></tr>`;
    }
  }).catch(err=>{
    document.getElementById("table-body").innerHTML=`<tr><td colspan="${sheetsConfig[currentSheet].columns.length}">⚠️ Tidak dapat memuat data. Periksa koneksi internet Anda.</td></tr>`;
  });
}

function formatRupiah(angka){
  if(!angka) return "-";
  const num = Number(String(angka).toString().replace(/[^0-9]/g,""));
  return "Rp. "+num.toLocaleString("id-ID")+",-";
}

function highlightText(text, keyword){
  if(!keyword) return text;
  const regex=new RegExp(`(${keyword.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&')})`,'gi');
  return text.replace(regex,'<span class="highlight">$1</span>');
}

function getFilteredData(){
  const startDateVal=document.getElementById("startDate").value;
  const endDateVal=document.getElementById("endDate").value;
  const startDate=startDateVal?new Date(startDateVal):null;
  const endDate=endDateVal?new Date(endDateVal):null;
  return allData.filter(row=>{
    let matchDate=true;
    if(startDate && row["TanggalObj"]) matchDate = matchDate && row["TanggalObj"]>=startDate;
    if(endDate && row["TanggalObj"]) matchDate = matchDate && row["TanggalObj"]<=endDate;
    let matchText=currentKeyword?Object.values(row).some(val=>String(val).toLowerCase().includes(currentKeyword)):true;
    return matchDate && matchText;
  });
}

function renderTable(){
  filteredData=getFilteredData();
  const tbody=document.getElementById("table-body");
  const thead=document.getElementById("table-head");
  tbody.innerHTML=""; thead.innerHTML="";
  const columns=sheetsConfig[currentSheet].columns;

  const trHead=document.createElement("tr");
  columns.forEach(col=>{ const th=document.createElement("th"); th.textContent=col; trHead.appendChild(th); });
  thead.appendChild(trHead);

  const start=(currentPage-1)*sheetsConfig[currentSheet].rowsPerPage;
  const end=start+sheetsConfig[currentSheet].rowsPerPage;
  const dataToShow=filteredData.slice(start,end);

  if(dataToShow.length===0){
    tbody.innerHTML=`<tr><td colspan="${columns.length}">Tidak ada data</td></tr>`;
    document.getElementById("pagination").innerHTML="";
    document.getElementById("total-container").textContent="";
    return;
  }

  dataToShow.forEach(row=>{
    const tr=document.createElement("tr");
    tr.innerHTML=columns.map(col=>{
      let val=row[col]||"";
      if(["JUMLAH","Hasil (Rp)","NOMINAL (Rp)"].includes(col))
  val = `<span class="rupiah">${val}</span>`;
      if(col==="FOTO" && val) val=`<img src="${val}" alt="Foto">`;
      return `<td>${highlightText(val,currentKeyword)}</td>`;
    }).join("");
    tbody.appendChild(tr);
  });

  if(["harian","bulanan","pengeluaran"].includes(currentSheet)){
    const sum = filteredData.reduce((acc,row)=>{
      const val = Number(String(row["Hasil (Rp)"] || row["NOMINAL (Rp)"] || row["JUMLAH"]).replace(/[^0-9]/g,""));
      return acc + (isNaN(val)?0:val);
    },0);
    document.getElementById("total-container").textContent = "Total: " + formatRupiah(sum);
  } else {
    document.getElementById("total-container").textContent = "";
  }

  renderPagination();
}

function renderPagination(){
  const pagination=document.getElementById("pagination"); pagination.innerHTML="";
  const totalPages=Math.ceil(filteredData.length/sheetsConfig[currentSheet].rowsPerPage);
  if(totalPages<=1) return;
  const prev=document.createElement("button"); prev.textContent="⬅️"; prev.disabled=currentPage===1; prev.onclick=()=>{currentPage--; renderTable();}; pagination.appendChild(prev);
  for(let i=1;i<=totalPages;i++){
    const b=document.createElement("button"); b.textContent=i; if(i===currentPage) b.classList.add("active");
    b.onclick=()=>{currentPage=i; renderTable();};
    pagination.appendChild(b);
  }
  const next=document.createElement("button"); next.textContent="➡️"; next.disabled=currentPage===totalPages; next.onclick=()=>{currentPage++; renderTable();}; pagination.appendChild(next);
}

document.getElementById("searchBox").addEventListener("input",()=>{currentKeyword=document.getElementById("searchBox").value.toLowerCase(); currentPage=1; renderTable();});
document.getElementById("startDate").addEventListener("change",()=>{currentPage=1; renderTable();});
document.getElementById("endDate").addEventListener("change",()=>{currentPage=1; renderTable();});

function resetFilter(){
  document.getElementById("searchBox").value=""; document.getElementById("startDate").value="";
  document.getElementById("endDate").value=""; currentKeyword=""; filteredData=allData; currentPage=1; renderTable();
}

document.querySelectorAll("#menu button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("#menu button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentSheet=btn.dataset.sheet; currentPage=1; resetFilter(); fetchData();
  });
});

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('l','pt','a4');
  doc.setFontSize(12);
  const title=document.querySelector("#menu button.active").textContent;
  doc.text(title,40,20);
  const columns=sheetsConfig[currentSheet].columns;
  doc.autoTable({
    head:[columns],
    body:filteredData.map(row=>columns.map(c=>row[c]||"")),
    startY:40,
    theme:'grid',
    styles:{fontSize:8, cellPadding:3, halign:'center'}
  });
  doc.save(`${title.replace(/\s/g,"_")}.pdf`);
}

fetchData();
setInterval(fetchData,5*60*1000);
</script>
</body>
</html>
