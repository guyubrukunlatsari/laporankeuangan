<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>REKAP DATA RT 04 RW 01 LATSARI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #0b0f17;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 0;
  }
  h1 { color: #00ff99; margin: 20px 0 10px; }
  select, input, button {
    margin: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
  }
  select, input { width: 180px; }
  button {
    background: #00ff99;
    color: #000;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background: #00cc7a; }
  table {
    border-collapse: collapse;
    width: 95%;
    margin: 10px auto;
    background-color: #1a1f29;
    border-radius: 12px;
    overflow: hidden;
  }
  th, td {
    border: 1px solid #333;
    padding: 6px;
    text-align: center;
  }
  th {
    background: #00ff99;
    color: #000;
    position: sticky;
    top: 0;
  }
  tr:nth-child(even) { background-color: #151922; }
  td.nominal, td.jumlah, .rupiah { color: #00ff99; font-weight: bold; }
  #pagination button {
    margin: 4px;
    padding: 5px 10px;
    border-radius: 6px;
    border: none;
    background: #00ff99;
    color: #000;
  }
  #pagination button.active { background: #007a55; color: #fff; }
  #total-container {
    text-align:center;
    margin-top:5px;
    font-weight:bold;
    color:#00ff88;
  }
</style>
</head>
<body>
<h1 id="judul-halaman">REKAP DATA RT 04 RW 01 LATSARI</h1>

<div>
  <label>Pilih Halaman:</label>
  <select id="sheet-select" onchange="changeSheet()">
    <option value="jimpitan">Jimpitan Harian</option>
    <option value="harian">Laporan Harian</option>
    <option value="bulanan">Laporan Bulanan</option>
    <option value="pengeluaran">Laporan Pengeluaran</option>
  </select>
</div>

<div>
  <input type="date" id="start-date"> s/d
  <input type="date" id="end-date">
  <input type="text" id="search-input" placeholder="Cari...">
  <button onclick="exportPDF()">Export PDF</button>
</div>

<table id="data-table">
  <thead><tr id="table-header"></tr></thead>
  <tbody id="table-body"><tr><td>Memuat data...</td></tr></tbody>
</table>
<div id="pagination"></div>
<div id="total-container"></div>

<script>
const sheetsConfig = {
  jimpitan: {
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-XXXX/pub?gid=0&single=true&output=csv",
    columns: ["No", "Tanggal", "Nama", "RT", "RW", "Hasil (Rp)", "Keterangan"]
  },
  harian: {
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-XXXX/pub?gid=111&single=true&output=csv",
    columns: ["No", "Tanggal", "Petugas", "Kegiatan", "Hasil (Rp)"]
  },
  bulanan: {
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-XXXX/pub?gid=222&single=true&output=csv",
    columns: ["No", "Bulan", "Nama", "Jumlah"]
  },
  pengeluaran: {
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-XXXX/pub?gid=333&single=true&output=csv",
    columns: ["No", "Tanggal", "Keperluan", "Nominal (Rp)", "Keterangan", "Foto"]
  }
};

let currentSheet = "jimpitan";
let allData = [];
let filteredData = [];
let currentPage = 1;
const rowsPerPage = 10;

function showLoading() {
  document.getElementById("table-body").innerHTML = `<tr><td colspan="8">⏳ Memuat data...</td></tr>`;
}

function changeSheet() {
  currentSheet = document.getElementById("sheet-select").value;
  document.getElementById("judul-halaman").textContent =
    currentSheet === "jimpitan" ? "JIMPITAN HARIAN" :
    currentSheet === "harian" ? "LAPORAN HARIAN" :
    currentSheet === "bulanan" ? "LAPORAN BULANAN" : "LAPORAN PENGELUARAN";
  fetchData();
}

function parseDate(val) {
  if (!val) return { text: "", raw: new Date("1970-01-01") };
  if (typeof val === "string" && val.includes("Date(")) {
    const m = val.match(/Date\\((\\d+),(\\d+),(\\d+)/);
    if (m) {
      const d = new Date(m[1], m[2], m[3]);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return { text: `${day}-${month}-${year}`, raw: d };
    }
  }
  const d = new Date(val);
  if (!isNaN(d)) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return { text: `${day}-${month}-${year}`, raw: d };
  }
  return { text: val, raw: new Date("1970-01-01") };
}

function fetchData() {
  showLoading();
  const config = sheetsConfig[currentSheet];
  fetch(config.url)
    .then(res => res.text())
    .then(csv => {
      const rows = csv.trim().split(/\r?\n/).map(r => r.split(","));
      const headers = rows.shift();
      allData = rows.map(r => {
        const obj = {};
        headers.forEach((h,i)=>obj[h.trim()] = r[i] || "");
        if (obj["Tanggal"]) {
          const {text,raw} = parseDate(obj["Tanggal"]);
          obj["Tanggal"] = text;
          obj._dateRaw = raw;
        }
        return obj;
      });
      renderTable();
    })
    .catch(err=>{
      document.getElementById("table-body").innerHTML =
        `<tr><td colspan="${sheetsConfig[currentSheet].columns.length}">⚠️ Tidak dapat memuat data.</td></tr>`;
    });
}

function renderTable() {
  const cols = sheetsConfig[currentSheet].columns;
  let headerHTML = cols.map(c=>{
    if(currentSheet==="jimpitan") c=c.toUpperCase();
    return `<th>${c}</th>`;
  }).join("");
  document.getElementById("table-header").innerHTML = headerHTML;

  const searchVal = document.getElementById("search-input").value.toLowerCase();
  const start = new Date(document.getElementById("start-date").value);
  const end = new Date(document.getElementById("end-date").value);
  filteredData = allData.filter(row=>{
    const t = row["Tanggal"] ? new Date(row._dateRaw) : null;
    const matchDate = !document.getElementById("start-date").value || (t && t>=start && t<=end);
    const matchSearch = !searchVal || Object.values(row).some(v=>String(v).toLowerCase().includes(searchVal));
    return matchDate && matchSearch;
  });

  const totalPages = Math.ceil(filteredData.length / rowsPerPage);
  if(currentPage>totalPages) currentPage=1;
  const startIdx = (currentPage-1)*rowsPerPage;
  const dataPage = filteredData.slice(startIdx, startIdx+rowsPerPage);

  const rowsHTML = dataPage.map(row=>{
    return "<tr>"+cols.map(col=>{
      let val = row[col] || "";
      if(["JUMLAH","Hasil (Rp)","NOMINAL (Rp)","Jumlah","Nominal (Rp)"].includes(col))
        val = `<span class='rupiah'>${val}</span>`;
      return `<td>${val}</td>`;
    }).join("")+"</tr>";
  }).join("");
  document.getElementById("table-body").innerHTML = rowsHTML || "<tr><td colspan='"+cols.length+"'>Tidak ada data</td></tr>";

  document.getElementById("pagination").innerHTML = "";
  for(let i=1;i<=totalPages;i++){
    const btn=document.createElement("button");
    btn.textContent=i;
    if(i===currentPage) btn.classList.add("active");
    btn.onclick=()=>{currentPage=i;renderTable();};
    document.getElementById("pagination").appendChild(btn);
  }

  if(["harian","bulanan","pengeluaran","jimpitan"].includes(currentSheet)){
    const sum = filteredData.reduce((acc,row)=>{
      const val = Number(String(row["Hasil (Rp)"] || row["NOMINAL (Rp)"] || row["JUMLAH"]).replace(/[^0-9]/g,""));
      return acc + (isNaN(val)?0:val);
    },0);
    document.getElementById("total-container").textContent = "Total: Rp " + sum.toLocaleString("id-ID");
  } else {
    document.getElementById("total-container").textContent = "";
  }
}

function exportPDF(){
  window.print();
}

setInterval(fetchData, 300000); // refresh 5 menit
fetchData();
</script>
</body>
</html>
