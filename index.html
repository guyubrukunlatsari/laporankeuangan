<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard RT 04 RW 01 - Responsif</title>
<style>
body { font-family:'Segoe UI',sans-serif; background:#0f0f0f; color:#f1f1f1; margin:0; padding:15px; }
h1 { text-align:center; color:#00ff88; margin-bottom:15px; font-size:1.5rem; }

.filter-container {
  display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; margin-bottom:10px;
}
.filter-container input, .filter-container button, .filter-container select {
  background:#1a1a1a; border:1px solid #444; color:#fff; padding:6px 8px; border-radius:6px; font-size:0.9rem;
}
.filter-container button { background:#00cc66; color:#000; font-weight:bold; cursor:pointer; transition:0.2s; }
.filter-container button:hover { background:#00ff88; }

.table-wrapper { display:flex; flex-direction:column; gap:2px; }
.table-row { display:flex; flex-wrap:wrap; background:#1a1a1a; border-radius:5px; overflow:hidden; }
.table-row.header { background:#00cc66; color:#000; font-weight:bold; }
.table-cell { flex:1 1 100px; padding:6px 8px; text-align:center; font-size:0.85rem; border-bottom:1px solid #333; word-break:break-word; }
.table-cell.hasil { text-align:right; color:#00ff99; font-weight:bold; }

.highlight { background:#00ff44; color:#000; font-weight:bold; border-radius:3px; padding:0 2px; }

.pagination { display:flex; justify-content:center; flex-wrap:wrap; gap:5px; margin-top:10px; }
.pagination button { font-size:0.8rem; padding:4px 6px; border-radius:4px; }
.pagination button.active { background:#00ff88; color:#000; transform:scale(1.1); }
.pagination button:disabled { background:#333; color:#777; cursor:not-allowed; }

footer { text-align:center; font-size:12px; color:#777; margin-top:15px; }

@media(max-width:600px){
  h1{ font-size:1.2rem; }
  .filter-container input, .filter-container button, .filter-container select{ width:100%; max-width:220px; font-size:0.85rem; }
  .table-cell{ font-size:0.7rem; padding:4px 5px; }
}
</style>
</head>
<body>

<h1>Dashboard RT 04 RW 01</h1>

<div class="filter-container">
  <select id="sheetSelect" onchange="loadSheet(this.value)">
    <option value="Jimpitan Harian">Jimpitan Harian</option>
    <option value="Warga Bulanan">Warga Bulanan</option>
    <option value="Pengeluaran">Pengeluaran</option>
    <option value="Rekap RT">Rekap Keuangan RT</option>
  </select>
  <label>Dari: <input type="date" id="startDate"></label>
  <label>Sampai: <input type="date" id="endDate"></label>
  <input type="text" id="searchBox" placeholder="🔎 Cari semua kolom..." />
  <button onclick="resetFilter()">🔄 Reset</button>
  <button onclick="exportPDF()">📄 Export PDF</button>
</div>

<div class="table-wrapper" id="table-wrapper">
  <div class="table-row header" id="table-header"></div>
</div>

<div class="pagination" id="pagination"></div>
<footer>Data otomatis diperbarui dari Google Sheet</footer>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const sheets = {
  "Jimpitan Harian":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFzjNwESJhj-eGvY4RH3dsV2hT7D4bvD-MohbrKWuVN1P5w7jUWtLoG1dw5Yf6ddboiZAPzY6wlYce/pub?gid=0&single=true&output=csv",
  "Warga Bulanan":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFzjNwESJhj-eGvY4RH3dsV2hT7D4bvD-MohbrKWuVN1P5w7jUWtLoG1dw5Yf6ddboiZAPzY6wlYce/pub?gid=2060081132&single=true&output=csv",
  "Pengeluaran":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFzjNwESJhj-eGvY4RH3dsV2hT7D4bvD-MohbrKWuVN1P5w7jUWtLoG1dw5Yf6ddboiZAPzY6wlYce/pub?gid=964446042&single=true&output=csv",
  "Rekap RT":"https://docs.google.com/spreadsheets/d/e/2PACX-1vSFzjNwESJhj-eGvY4RH3dsV2hT7D4bvD-MohbrKWuVN1P5w7jUWtLoG1dw5Yf6ddboiZAPzY6wlYce/pub?gid=1757968316&single=true&output=csv"
};

let allData=[], filteredData=[], currentPage=1, rowsPerPage=10, currentKeyword="", currentHeaders=[];

function parseTanggal(tglStr){
  if(!tglStr) return null;
  const m=tglStr.match(/\d{1,2} (\w+) (\d{4})/);
  if(m){ const monthNames=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"]; const day=parseInt(m[1]); const month=monthNames.indexOf(m[2]); const year=parseInt(m[3]); if(month!==-1) return new Date(year,month,day); }
  const parts=tglStr.split("/"); if(parts.length===3) return new Date(parts[2],parts[1]-1,parts[0]);
  return null;
}

function loadSheet(sheetName){
  const url=sheets[sheetName];
  document.getElementById("table-header").innerHTML="⏳ Memuat header...";
  const wrapper=document.getElementById("table-wrapper"); wrapper.innerHTML="";
  Papa.parse(url,{download:true, header:true, skipEmptyLines:true,
    complete:function(results){
      if(!results.data || results.data.length===0){
        wrapper.innerHTML="<div class='table-row'><div class='table-cell'>Tidak ada data</div></div>";
        return;
      }
      allData = results.data.map((row,i)=>{ row.no=i+1; if(row["Tanggal"]) row.tanggalObj=parseTanggal(row["Tanggal"]); return row; }).reverse();
      filteredData=allData;
      currentHeaders=Object.keys(allData[0]||{}).filter(h=>"no,tanggalObj".indexOf(h)===-1);
      renderHeader(); renderTable();
    },
    error:function(err){ wrapper.innerHTML=`<div class='table-row'><div class='table-cell'>❌ Gagal memuat data: ${err.message}</div></div>`; }
  });
}

function renderHeader(){
  const header=document.getElementById("table-header"); header.innerHTML="";
  const hRow=document.createElement("div"); hRow.classList.add("table-row","header");
  hRow.innerHTML="<div class='table-cell'>No</div>"+currentHeaders.map(h=>`<div class='table-cell'>${h}</div>`).join("");
  header.appendChild(hRow);
}

function highlightText(text, keyword){ if(!keyword) return text; const regex=new RegExp(`(${keyword.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&')})`,'gi'); return text.replace(regex,'<span class="highlight">$1</span>'); }

function getFilteredData(){
  const startDateVal=document.getElementById("startDate").value;
  const endDateVal=document.getElementById("endDate").value;
  const startDate=startDateVal?new Date(startDateVal):null;
  const endDate=endDateVal?new Date(endDateVal):null;
  return allData.filter(r=>{
    let matchDate=true; if(startDate && endDate && r.tanggalObj) matchDate=r.tanggalObj>=startDate && r.tanggalObj<=endDate;
    let matchText=currentKeyword?Object.values(r).some(v=>String(v).toLowerCase().includes(currentKeyword)):true;
    return matchDate && matchText;
  });
}

function renderTable(){
  filteredData=getFilteredData();
  const wrapper=document.getElementById("table-wrapper"); wrapper.innerHTML=""; 
  const start=(currentPage-1)*rowsPerPage; const end=start+rowsPerPage;
  const dataToShow=filteredData.slice(start,end);
  if(dataToShow.length===0){ wrapper.innerHTML="<div class='table-row'><div class='table-cell'>Tidak ada data</div></div>"; document.getElementById("pagination").innerHTML=""; return; }
  dataToShow.forEach((r,i)=>{
    const tr=document.createElement("div"); tr.classList.add("table-row");
    tr.innerHTML=`<div class='table-cell'>${start+i+1}</div>`+currentHeaders.map(h=>`<div class='table-cell'>${highlightText(r[h]||"",currentKeyword)}</div>`).join("");
    wrapper.appendChild(tr);
  });
  renderPagination();
}

function renderPagination(){
  const pagination=document.getElementById("pagination"); pagination.innerHTML="";
  const totalPages=Math.ceil(filteredData.length/rowsPerPage);
  if(totalPages<=1) return;
  const prev=document.createElement("button"); prev.textContent="⬅️"; prev.disabled=currentPage===1; prev.onclick=()=>{currentPage--; renderTable();}; pagination.appendChild(prev);
  for(let i=1;i<=totalPages;i++){ const b=document.createElement("button"); b.textContent=i; if(i===currentPage)b.classList.add("active"); b.onclick=()=>{currentPage=i; renderTable();}; pagination.appendChild(b);}
  const next=document.createElement("button"); next.textContent="➡️"; next.disabled=currentPage===totalPages; next.onclick=()=>{currentPage++; renderTable();}; pagination.appendChild(next);
}

document.getElementById("searchBox").addEventListener("input",()=>{ currentKeyword=document.getElementById("searchBox").value.toLowerCase(); currentPage=1; renderTable(); });
document.getElementById("startDate").addEventListener("change",()=>{currentPage=1; renderTable();});
document.getElementById("endDate").addEventListener("change",()=>{currentPage=1; renderTable();});

function resetFilter(){ document.getElementById("searchBox").value=""; document.getElementById("startDate").value=""; document.getElementById("endDate").value=""; currentKeyword=""; filteredData=allData; currentPage=1; renderTable(); }

async function exportPDF(){
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF('l','pt','a4'); doc.setFontSize(10);
  doc.text(`Laporan ${document.getElementById("sheetSelect").value}`,40,20);
  let y=40, startX=40;
  doc.text("No",startX,y); currentHeaders.forEach((h,i)=>{ doc.text(h,startX+(i+1)*80,y); }); y+=15;
  filteredData.forEach((r,i)=>{ const rowY=y+i*15; doc.text(String(i+1),startX,rowY); currentHeaders.forEach((h,j)=>{ doc.text(String(r[h]||""),startX+(j+1)*80,rowY); }); });
  doc.save(`${document.getElementById("sheetSelect").value}.pdf`);
}

// Load default
loadSheet(document.getElementById("sheetSelect").value);
</script>
</body>
</html>
