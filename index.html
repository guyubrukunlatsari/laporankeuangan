<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>REKAP KEUANGAN RT 04 RW 01 LATSARI TUBAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #121212;
      color: #fff;
      text-align: center;
    }
    header {
      background: #1f1f1f;
      padding: 10px 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { font-size: 20px; margin: 10px 0; color: #00e676; }
    select, input, button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      margin: 4px;
    }
    select, input { width: 180px; }
    table {
      width: 98%;
      margin: 10px auto;
      border-collapse: collapse;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 8px;
      border: 1px solid #333;
      text-align: center;
    }
    th {
      background: #2a2a2a;
      color: #00e676;
      position: sticky;
      top: 80px;
      z-index: 5;
    }
    tr:nth-child(even) { background: #181818; }
    tr:hover { background: #252525; }
    #pagination { margin: 10px; }
    .page-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      border-radius: 5px;
    }
    .page-btn.active { background: #00e676; color: #000; }
    .rupiah {
      color: #00ff88;
      font-weight: 600;
    }
    #total-container {
      text-align: center;
      margin-top: 5px;
      font-weight: bold;
      color: #00ff88;
    }
  </style>
</head>
<body>
  <header>
    <h1>REKAP KEUANGAN RT 04 RW 01 LATSARI TUBAN</h1>
    <div>
      <select id="sheet-selector" onchange="changeSheet()">
        <option value="harian">Laporan Jaga & Jimpitan Harian</option>
        <option value="bulanan">Laporan Warga Bulanan</option>
        <option value="pengeluaran">Laporan Pengeluaran</option>
      </select>
      <input type="date" id="start-date"> 
      <input type="date" id="end-date">
      <input type="text" id="search" placeholder="Cari teks...">
      <button onclick="exportPDF()">Export PDF</button>
    </div>
  </header>

  <table id="data-table">
    <thead><tr id="table-header"></tr></thead>
    <tbody id="table-body"></tbody>
  </table>
  <div id="pagination"></div>
  <div id="total-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const sheetsConfig = {
      harian: {
        url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSFzjNwESJhj-eGvY4RH3dsV2hT7D4bvD-MohbrKWuVN1/pub?output=csv",
        columns: ["No", "Tanggal", "Nama Petugas", "Shift", "Hasil (Rp)", "Keterangan"]
      },
      bulanan: {
        url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSf-2xSYghmTe-bulanan123/pub?output=csv",
        columns: ["No", "Tanggal", "Nama Warga", "Jumlah (Rp)", "Keterangan"]
      },
      pengeluaran: {
        url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSf-3xSYghmTe-pengeluaran456/pub?output=csv",
        columns: ["No", "Tanggal", "Keperluan", "Nominal (Rp)", "Keterangan"]
      }
    };

    let currentSheet = "harian";
    let allData = [];
    let filteredData = [];
    const rowsPerPage = 10;
    let currentPage = 1;

    function changeSheet() {
      currentSheet = document.getElementById("sheet-selector").value;
      fetchData();
    }

    function showLoading() {
      document.getElementById("table-body").innerHTML = `<tr><td colspan="8">⏳ Memuat data...</td></tr>`;
    }

    function parseDate(val) {
      if (!val) return { text: "", raw: new Date("1970-01-01") };
      if (typeof val === "string" && val.includes("Date(")) {
        const m = val.match(/Date\\((\\d+),(\\d+),(\\d+)\\)/);
        if (m) {
          const d = new Date(m[1], m[2], m[3]);
          return formatDateObj(d);
        }
      }
      const d = new Date(val);
      if (!isNaN(d)) return formatDateObj(d);
      return { text: val, raw: new Date("1970-01-01") };
    }

    function formatDateObj(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return { text: `${day}-${month}-${year}`, raw: d };
    }

    function formatRupiah(num) {
      return "Rp " + num.toLocaleString("id-ID");
    }

    function fetchData() {
      showLoading();
      const config = sheetsConfig[currentSheet];
      fetch(config.url)
        .then(res => res.text())
        .then(csv => {
          const rows = csv.trim().split("\\n").map(r => r.split(","));
          const headers = rows.shift();
          allData = rows.map(r => {
            const obj = {};
            headers.forEach((h, i) => obj[h.trim()] = r[i]);
            return obj;
          });
          renderTable();
        })
        .catch(err => {
          document.getElementById("table-body").innerHTML = 
            `<tr><td colspan="${sheetsConfig[currentSheet].columns.length}">⚠️ Tidak dapat memuat data.</td></tr>`;
        });
    }

    function renderTable() {
      const config = sheetsConfig[currentSheet];
      const start = document.getElementById("start-date").value;
      const end = document.getElementById("end-date").value;
      const q = document.getElementById("search").value.toLowerCase();

      filteredData = allData.filter(row => {
        const dateObj = parseDate(row["Tanggal"]);
        const matchDate = (!start || dateObj.raw >= new Date(start)) && (!end || dateObj.raw <= new Date(end));
        const matchSearch = Object.values(row).some(v => v && v.toLowerCase().includes(q));
        return matchDate && matchSearch;
      });

      const startIdx = (currentPage - 1) * rowsPerPage;
      const pageData = filteredData.slice(startIdx, startIdx + rowsPerPage);

      const headerHTML = config.columns.map(c => `<th>${c}</th>`).join("");
      document.getElementById("table-header").innerHTML = headerHTML;

      const rowsHTML = pageData.map(row => {
        return `<tr>${config.columns.map(col => {
          let val = row[col] || "";
          if (col.toLowerCase().includes("tanggal")) val = parseDate(val).text;
          if (["hasil (rp)", "nominal (rp)", "jumlah", "jumlah (rp)"].includes(col.toLowerCase()))
            return `<td class='rupiah'>${val}</td>`;
          return `<td>${val}</td>`;
        }).join("")}</tr>`;
      }).join("");
      document.getElementById("table-body").innerHTML = rowsHTML;

      renderPagination();
      updateTotal();
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / rowsPerPage);
      let html = "";
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
      }
      document.getElementById("pagination").innerHTML = html;
    }

    function goToPage(n) {
      currentPage = n;
      renderTable();
    }

    function updateTotal() {
      if (["harian", "bulanan", "pengeluaran"].includes(currentSheet)) {
        const sum = filteredData.reduce((acc, row) => {
          const val = Number(String(row["Hasil (Rp)"] || row["Nominal (Rp)"] || row["Jumlah"]).replace(/[^0-9]/g,""));
          return acc + (isNaN(val) ? 0 : val);
        }, 0);
        document.getElementById("total-container").textContent = "Total: " + formatRupiah(sum);
      } else {
        document.getElementById("total-container").textContent = "";
      }
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape" });
      doc.text("Rekap Keuangan RT 04 RW 01 Latsari Tuban", 10, 10);
      let y = 20;
      const config = sheetsConfig[currentSheet];
      filteredData.forEach(row => {
        doc.text(config.columns.map(col => `${row[col] || ""}`).join(" | "), 10, y);
        y += 7;
        if (y > 190) { doc.addPage(); y = 20; }
      });
      doc.save(`${currentSheet}.pdf`);
    }

    document.getElementById("search").addEventListener("input", ()=>{currentPage=1;renderTable();});
    document.getElementById("start-date").addEventListener("change", ()=>{currentPage=1;renderTable();});
    document.getElementById("end-date").addEventListener("change", ()=>{currentPage=1;renderTable();});

    fetchData();
    setInterval(fetchData, 300000);
  </script>
</body>
</html>
