<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DASHBOARD KEUANGAN RT 04 RW 01 LATSARI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00ff88;
  --muted:#aaa;
  --bg:#0f0f0f;
  --panel:#1a1a1a;
  --accent:#00cc66;
}
body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: #f1f1f1; margin:0; padding:12px;}
h1 { text-align:center; color:var(--green); margin-bottom:10px; font-size:1.2rem;}
#menu { display:flex; justify-content:center; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
#menu button { padding:6px 12px; border:none; border-radius:6px; font-weight:600; cursor:pointer; transition:0.15s; background:var(--accent); color:#000;}
#menu button.active, #menu button:hover { background:var(--green); }

.filter-container { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-bottom:10px; align-items:center; }
.filter-container label { color:#ddd; font-size:0.85rem; display:flex; gap:4px; align-items:center; }
.filter-container input[type="date"], .filter-container input[type="text"], .filter-container button {
  padding:5px 6px; border-radius:6px; border:1px solid #333; background:var(--panel); color:#fff; font-size:0.85rem;
}
.filter-container input[type="text"]{ min-width:120px; }
.filter-container button { background:var(--accent); color:#000; font-weight:600; cursor:pointer; }
.filter-container button:hover{ background:var(--green); }

.table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:10px; border-radius:6px; width:100%; }
table { width:100%; border-collapse:collapse; table-layout:auto; }
th, td { padding:6px; font-size:0.78rem; border-bottom:1px solid #333; text-align:center; vertical-align:middle; word-break:break-word; white-space:normal;}
th { background-color:var(--accent); color:#000; font-weight:700; position:sticky; top:0; z-index:2; }
td.foto img { max-width:40px; max-height:35px; border-radius:4px; display:block; margin:auto; }
tr:nth-child(even){background:#171717;}
tr:hover{background:#222;}

.highlight{background:#00ff44;color:#000;font-weight:700;border-radius:3px;padding:0 2px;}
td.nominal-cell { color: var(--green) !important; font-weight:700; }

.pagination{display:flex; justify-content:center; flex-wrap:wrap; gap:4px; margin-top:6px;}
.pagination button{padding:4px 6px; border-radius:6px; font-size:0.75rem; background:#222; color:#ddd; border:1px solid #333;}
.pagination button.active{background:var(--green); color:#000; transform:scale(1.05);}
.pagination button:disabled{background:#333;color:#777; cursor:not-allowed;}

#update-time {text-align:center; color:var(--muted); font-size:0.7rem; margin-bottom:4px;}
#total-container { text-align:center; margin-top:4px; font-weight:700; color:var(--green); }
footer { text-align:center; font-size:10px; color:#777; margin-top:10px; }

.loader { border: 3px solid #333; border-top: 3px solid var(--green); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin:auto; }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* === Responsive Card Mode for small screens === */
@media(max-width:600px){
  table, thead, tbody, th, td, tr { display:block; width:100%; }
  thead { display:none; }
  tr { margin-bottom:10px; border:1px solid #333; border-radius:6px; padding:6px; background:#1a1a1a; }
  td { text-align:left; padding:4px 6px; border:none; display:flex; justify-content:space-between; }
  td.nominal-cell { text-align:right; }
  td.foto img { max-width:50px; max-height:50px; }
  td::before { font-weight:600; color:#aaa; content:attr(data-label); }
}
@media(max-width:400px){
  h1 { font-size:0.9rem; }
  #menu button { font-size:0.65rem; padding:2px 4px; }
  .filter-container input[type="text"]{ min-width:60px; }
}
</style>
</head>
<body>
<h1>DASHBOARD KEUANGAN RT 04 RW 01 LATSARI</h1>

<div id="menu">
  <button class="active" data-sheet="harian">Jimpitan Harian</button>
  <button data-sheet="bulanan">Warga Bulanan</button>
  <button data-sheet="pengeluaran">Pengeluaran</button>
  <button data-sheet="rekap">Rekap Keuangan</button>
</div>

<div id="update-time">Diperbarui otomatis: ⏳</div>

<div class="filter-container">
  <label>Dari: <input type="date" id="startDate"></label>
  <label>Sampai: <input type="date" id="endDate"></label>
  <input type="text" id="searchBox" placeholder="🔎 Cari semua kolom..." />
  <button id="resetBtn">🔄 Reset</button>
  <button id="pdfBtn">📄 Export PDF</button>
</div>

<div class="table-wrapper">
  <table id="main-table" role="table" aria-label="Data keuangan">
    <thead id="table-head"></thead>
    <tbody id="table-body"><tr><td colspan="8"><div class="loader"></div></td></tr></tbody>
  </table>
</div>

<div id="total-container"></div>
<div class="pagination" id="pagination"></div>
<footer>Data otomatis diperbarui dari Google Sheet</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
/* === Semua script sama seperti sebelumnya, tambahan untuk card mode === */
function renderTable(){
  filteredData=getFilteredData();
  const cfg=sheetsConfig[currentSheet];
  const thead=document.getElementById("table-head");
  const tbody=document.getElementById("table-body");
  tbody.innerHTML=""; thead.innerHTML="";

  if(window.innerWidth>600){
    const trh=document.createElement("tr");
    cfg.columns.forEach(c=>{ const th=document.createElement("th"); th.textContent=c; trh.appendChild(th); });
    thead.appendChild(trh);
  }

  const start=(currentPage-1)*cfg.rowsPerPage;
  const end=start+cfg.rowsPerPage;
  const view=filteredData.slice(start,end);

  if(view.length===0){ tbody.innerHTML=`<tr><td colspan="${cfg.columns.length}">Tidak ada data</td></tr>`; document.getElementById("pagination").innerHTML=""; document.getElementById("total-container").textContent=""; return; }

  view.forEach(row=>{
    const tr=document.createElement("tr");
    tr.innerHTML=cfg.columns.map(col=>{
      const key=col.toUpperCase();
      let val=row[key]||"";
      let cls="";
      if(["HASIL (RP)","NOMINAL (RP)","JUMLAH"].includes(key)) cls="nominal-cell";
      if(["HADIR","IZIN","ALPHA"].includes(key)&&val) val=val.split("\n").map(l=>l.trim()).filter(Boolean).join("<br>");
      if(key==="FOTO"&&val) val=`<img src="${val}" alt="Foto">`; else val=highlightText(String(val),currentKeyword);
      if(window.innerWidth<=600) return `<td class="${cls}" data-label="${col}">${val}</td>`;
      return `<td class="${cls}">${val}</td>`;
    }).join("");
    tbody.appendChild(tr);
  });

  if(["harian","bulanan","pengeluaran"].includes(currentSheet)){
    const sum=filteredData.reduce((acc,row)=>{ const rawVal=(row["HASIL (RP)"]||row["NOMINAL (RP)"]||row["JUMLAH"])||""; const num=Number(String(rawVal).replace(/[^0-9]/g,"")); return acc+(isNaN(num)?0:num); },0);
    document.getElementById("total-container").textContent="Total: "+formatRupiah(sum);
  } else document.getElementById("total-container").textContent="";

  renderPagination();
}

/* === Event listeners, fetchData, exportPDF sama seperti sebelumnya === */
// (tidak perlu diubah)
</script>
</body>
</html>
