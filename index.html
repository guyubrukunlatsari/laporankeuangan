<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REKAP KEUANGAN RT 04 RW 01 LATSARI TUBAN</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: white;
    text-align: center;
    margin: 0;
    padding: 0;
  }
  h1 { margin: 20px 0; color: #00ff99; }
  table {
    border-collapse: collapse;
    width: 95%;
    margin: 10px auto;
    background-color: #1e1e1e;
  }
  th, td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
  }
  th {
    background-color: #00ff99;
    color: black;
    text-transform: uppercase;
  }
  tr:nth-child(even) { background-color: #2a2a2a; }
  tr:hover { background-color: #333; }
  #searchInput {
    width: 80%;
    padding: 8px;
    margin: 10px;
    border-radius: 5px;
    border: none;
  }
  .pagination button {
    background-color: #00ff99;
    border: none;
    padding: 8px 12px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
  }
  .pagination button:hover { background-color: #00cc77; }
  .total {
    font-weight: bold;
    color: #00ff99;
    margin-top: 10px;
  }
  /* Tambahan untuk kolom rupiah */
  td.rupiah {
    color: #00ff99;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>REKAP KEUANGAN RT 04 RW 01 LATSARI TUBAN</h1>

<input type="text" id="searchInput" placeholder="Cari data...">

<div id="menu">
  <button onclick="loadSheet('Laporan Jimpitan Harian')">Laporan Jimpitan Harian</button>
  <button onclick="loadSheet('Laporan Pengeluaran')">Laporan Pengeluaran</button>
  <button onclick="loadSheet('Laporan Warga Bulanan')">Laporan Warga Bulanan</button>
</div>

<div id="tableContainer"></div>
<div class="pagination" id="pagination"></div>
<div class="total" id="totalContainer"></div>

<script>
const sheetUrls = {
  "Laporan Jimpitan Harian": "URL_CSV_JIMPITAN",
  "Laporan Pengeluaran": "URL_CSV_PENGELUARAN",
  "Laporan Warga Bulanan": "URL_CSV_WARGA"
};

let allData = [];
let currentPage = 1;
const rowsPerPage = 10;

function formatRupiah(num) {
  if (!num || isNaN(num)) return num;
  return "Rp. " + Number(num).toLocaleString("id-ID") + ",-";
}

function parseDate(val) {
  if (!val) return { text: "", raw: new Date("1970-01-01") };
  if (typeof val === "string" && val.includes("Date(")) {
    const m = val.match(/Date\\((\\d+),(\\d+),(\\d+)\\)/);
    if (m) {
      const d = new Date(m[1], m[2], m[3]);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return { text: \`\${day}-\${month}-\${year}\`, raw: d };
    }
  }
  const d = new Date(val);
  if (!isNaN(d)) {
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return { text: \`\${day}-\${month}-\${year}\`, raw: d };
  }
  return { text: val, raw: new Date("1970-01-01") };
}

function renderTable(data, headers) {
  let html = "<table><thead><tr>";
  headers.forEach(h => html += \`<th>\${h}</th>\`);
  html += "</tr></thead><tbody>";

  data.forEach(row => {
    html += "<tr>";
    headers.forEach(col => {
      let val = row[col] || "";
      if (col.toLowerCase().includes("tanggal")) val = parseDate(val).text;
      if (["JUMLAH", "Hasil (Rp)", "NOMINAL (Rp)"].includes(col))
        val = \`<span class="rupiah">\${val}</span>\`;
      html += \`<td>\${val}</td>\`;
    });
    html += "</tr>";
  });

  html += "</tbody></table>";
  document.getElementById("tableContainer").innerHTML = html;

  // Hitung total nominal
  const nominalCols = ["JUMLAH", "Hasil (Rp)", "NOMINAL (Rp)"];
  let total = 0;
  data.forEach(r => {
    for (let c of nominalCols) {
      if (r[c]) total += Number(String(r[c]).replace(/[^0-9]/g, "")) || 0;
    }
  });
  document.getElementById("totalContainer").textContent =
    total ? "Total: " + formatRupiah(total) : "";
}

function renderPagination(totalRows) {
  const totalPages = Math.ceil(totalRows / rowsPerPage);
  const pagination = document.getElementById("pagination");
  pagination.innerHTML = "";
  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;
    btn.onclick = () => { currentPage = i; displayPage(); };
    pagination.appendChild(btn);
  }
}

function displayPage() {
  const start = (currentPage - 1) * rowsPerPage;
  const end = start + rowsPerPage;
  const search = document.getElementById("searchInput").value.toLowerCase();
  const filtered = allData.filter(row =>
    Object.values(row).some(v => String(v).toLowerCase().includes(search))
  );
  renderTable(filtered.slice(start, end), Object.keys(filtered[0] || {}));
  renderPagination(filtered.length);
}

async function loadSheet(name) {
  const res = await fetch(sheetUrls[name]);
  const text = await res.text();
  const rows = text.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];
  allData = rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i]);
    return obj;
  });
  currentPage = 1;
  displayPage();
}

document.getElementById("searchInput").addEventListener("input", displayPage);
</script>
</body>
</html>
